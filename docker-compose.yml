services:
  app:
    build: .
    container_name: telecom-ingestion
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/telecom_logs
      - PORT=3000
      - HOST=0.0.0.0
      - BATCH_SIZE=500
      - BATCH_INTERVAL_MS=100
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: telecom-postgres
    environment:
      - POSTGRES_DB=telecom_logs
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telecom_logs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
